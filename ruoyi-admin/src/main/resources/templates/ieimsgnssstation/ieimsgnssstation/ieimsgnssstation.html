<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('GNSS监测站设备信息列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>站点ID：</label>
                                <input type="text" name="stationId"/>
                            </li>
                            <li>
                                <label>设备名称：</label>
                                <input type="text" name="stationName"/>
                            </li>
                            <li>
                                <label>经度：</label>
                                <input type="text" name="longitude"/>
                            </li>
                            <li>
                                <label>纬度：</label>
                                <input type="text" name="latitude"/>
                            </li>
                            <li>
                                <label>高度：</label>
                                <input type="text" name="altitude"/>
                            </li>
                            <li>
                                <label>设备LOGO路径：</label>
                                <input type="text" name="logo"/>
                            </li>
                            <li>
                                <label>所属部门ID：</label>
                                <input type="text" name="deptId"/>
                            </li>
                            <li>
                                <label>负责人：</label>
                                <input type="text" name="manager"/>
                            </li>
                            <li>
                                <label>联系人：</label>
                                <input type="text" name="contact"/>
                            </li>
                            <li>
                                <label>联系电话：</label>
                                <input type="text" name="phone"/>
                            </li>
                            <li>
                                <label>是否启用：</label>
                                <select name="enableFlag" th:with="type=${@dict.getType('sys_yes_no')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>在线状态：</label>
                                <select name="onlineStatus" th:with="type=${@dict.getType('sys_yes_no')}">
                                    <option value="">所有</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>最后在线时间：</label>
                                <input type="text" class="time-input" placeholder="请选择最后在线时间" name="lastOnlineTime"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="ieimsgnssstation:ieimsgnssstation:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="ieimsgnssstation:ieimsgnssstation:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="ieimsgnssstation:ieimsgnssstation:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="ieimsgnssstation:ieimsgnssstation:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('ieimsgnssstation:ieimsgnssstation:edit')}]];
        var removeFlag = [[${@permission.hasPermi('ieimsgnssstation:ieimsgnssstation:remove')}]];
        var enableFlagDatas = [[${@dict.getType('sys_yes_no')}]];
        var onlineStatusDatas = [[${@dict.getType('sys_yes_no')}]];
        var prefix = ctx + "ieimsgnssstation/ieimsgnssstation";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "GNSS监测站设备信息",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '主键ID',
                    visible: false
                },
                {
                    field: 'stationId',
                    title: '站点ID'
                },
                {
                    field: 'stationName',
                    title: '设备名称'
                },
                {
                    field: 'longitude',
                    title: '经度'
                },
                {
                    field: 'latitude',
                    title: '纬度'
                },
                {
                    field: 'altitude',
                    title: '高度'
                },
                {
                    field: 'logo',
                    title: '设备LOGO路径'
                },
                {
                    field: 'deptId',
                    title: '所属部门ID'
                },
                {
                    field: 'manager',
                    title: '负责人'
                },
                {
                    field: 'contact',
                    title: '联系人'
                },
                {
                    field: 'phone',
                    title: '联系电话'
                },
                {
                    field: 'enableFlag',
                    title: '是否启用',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(enableFlagDatas, value);
                    }
                },
                {
                    field: 'onlineStatus',
                    title: '在线状态',
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(onlineStatusDatas, value);
                    }
                },
                {
                    field: 'lastOnlineTime',
                    title: '最后在线时间'
                },
                {
                    field: 'remark',
                    title: '备注'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
