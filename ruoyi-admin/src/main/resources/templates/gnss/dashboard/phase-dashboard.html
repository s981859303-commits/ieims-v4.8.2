<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('GNSS相位闪烁指数监控大屏')" />
    <th:block th:include="include :: echarts-js" />
    <style>
        /* 大屏样式 - 保持不变 */
        body {
            background-color: #0a1a2f;
            color: #ffffff;
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .dashboard-container {
            padding: 15px;
            background: linear-gradient(135deg, #0a1a2f 0%, #0d2b42 100%);
            min-height: 100vh;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .dashboard-header h1 {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
            padding: 15px 0;
            text-shadow: 0 0 20px rgba(0,212,255,0.3);
        }

        .dashboard-header .subtitle {
            font-size: 14px;
            color: #8ba0bc;
            margin-top: 5px;
        }

        .last-update-time {
            position: absolute;
            right: 20px;
            bottom: 10px;
            font-size: 13px;
            color: #00d4ff;
            background: rgba(0,212,255,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .last-update-time i {
            margin-right: 5px;
        }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -8px 20px -8px;
        }

        .stat-card-compact {
            flex: 1;
            min-width: 100px;
            background: rgba(15, 35, 55, 0.85);
            border-radius: 12px;
            padding: 12px 8px;
            margin: 0 8px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            text-align: center;
        }

        .stat-card-compact:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.15);
            border-color: rgba(0,212,255,0.5);
        }

        .stat-card-compact .stat-label {
            font-size: 12px;
            color: #8ba0bc;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .stat-card-compact .stat-value {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.2;
        }

        .stat-card-compact .stat-unit {
            font-size: 11px;
            margin-left: 3px;
            color: #8ba0bc;
        }

        .status-led-sm {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }

        .status-led-sm.green { background-color: #00C851; box-shadow: 0 0 6px #00C851; }
        .status-led-sm.yellow { background-color: #FFBB33; box-shadow: 0 0 6px #FFBB33; }
        .status-led-sm.orange { background-color: #FF8800; box-shadow: 0 0 6px #FF8800; }
        .status-led-sm.red { background-color: #FF4444; box-shadow: 0 0 6px #FF4444; }

        .level-none { color: #00C851; }
        .level-weak { color: #FFBB33; }
        .level-moderate { color: #FF8800; }
        .level-severe { color: #FF4444; }

        .status-led {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        .status-led.green { background-color: #00C851; box-shadow: 0 0 8px #00C851; }
        .status-led.yellow { background-color: #FFBB33; box-shadow: 0 0 8px #FFBB33; }
        .status-led.orange { background-color: #FF8800; box-shadow: 0 0 8px #FF8800; }
        .status-led.red { background-color: #FF4444; box-shadow: 0 0 8px #FF4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .table-custom {
            background: rgba(15, 35, 55, 0.85);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 0;
        }

        .table-custom thead th {
            background: rgba(0, 212, 255, 0.15);
            border: none;
            color: #00d4ff;
            font-weight: 500;
            padding: 12px 8px;
            font-size: 13px;
        }

        .table-custom tbody td {
            border-color: rgba(255,255,255,0.05);
            color: #e0e0e0;
            padding: 10px 8px;
            font-size: 13px;
            vertical-align: middle;
        }

        .table-custom tbody tr:hover {
            background: rgba(0, 212, 255, 0.08);
        }

        .data-updated {
            background: rgba(0,212,255,0.2) !important;
            transition: background 0.5s;
        }

        .blink {
            animation: pulse 1s ease-in-out;
        }

        .chart-container {
            background: rgba(15, 35, 55, 0.85);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .chart-container h4 {
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0,212,255,0.3);
            color: #00d4ff;
        }

        .chart-box {
            height: 300px;
            width: 100%;
        }

        .alert-banner {
            background: linear-gradient(90deg, rgba(255,68,68,0.2), rgba(255,68,68,0.05));
            border-left: 4px solid #FF4444;
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 20px;
        }

        .alert-banner.warning {
            border-left-color: #FF8800;
            background: linear-gradient(90deg, rgba(255,136,0,0.2), rgba(255,136,0,0.05));
        }

        .alert-banner.info {
            border-left-color: #00d4ff;
            background: linear-gradient(90deg, rgba(0,212,255,0.2), rgba(0,212,255,0.05));
        }

        .alert-banner.success {
            border-left-color: #00C851;
            background: linear-gradient(90deg, rgba(0,200,81,0.2), rgba(0,200,81,0.05));
        }

        .refresh-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: rgba(0,212,255,0.2);
            border: 1px solid rgba(0,212,255,0.5);
            color: #00d4ff;
            border-radius: 20px;
            padding: 5px 15px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        .refresh-btn:hover {
            background: rgba(0,212,255,0.4);
        }

        .ws-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            font-size: 11px;
            z-index: 1000;
        }

        .ws-connected { color: #2ecc71; }
        .ws-disconnected { color: #e74c3c; }

        .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: rgba(0,212,255,0.3);
            border-radius: 3px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(0,212,255,0.5);
        }

        @media (max-width: 1200px) {
            .stat-card-compact .stat-value { font-size: 20px; }
            .stat-card-compact .stat-label { font-size: 11px; white-space: normal; }
        }

        @media (max-width: 768px) {
            .stat-card-compact .stat-value { font-size: 16px; }
            .stat-card-compact .stat-label { font-size: 10px; }
            .dashboard-header h1 { font-size: 24px; }
            .stats-row { margin: 0 -4px 15px -4px; }
            .stat-card-compact { margin: 0 4px; padding: 8px 4px; }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10,26,47,0.9);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,212,255,0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div class="refresh-btn" onclick="phaseDashboard.refreshData()">
        <i class="fa fa-refresh"></i> 刷新数据
    </div>

    <div class="dashboard-header">
        <h1>
            <i class="fa fa-satellite"></i>
            GNSS相位闪烁指数监控大屏
        </h1>
        <div class="subtitle">
            Phase Scintillation Index (σφ) Monitoring Dashboard
        </div>
        <div class="last-update-time">
            <i class="fa fa-clock-o"></i> 最后更新: <span id="lastUpdateTime">--:--:--</span>
        </div>
    </div>

    <div id="alertBanner" class="alert-banner success">
        <i class="fa fa-check-circle"></i>
        <span id="alertMessage">系统运行正常</span>
    </div>

    <div class="stats-row">
        <div class="stat-card-compact">
            <div class="stat-label"><i class="fa fa-dashboard"></i> 整体状态</div>
            <div class="stat-value" id="overallStatus"><span class="status-led-sm green"></span>正常</div>
        </div>
        <div class="stat-card-compact">
            <div class="stat-label"><i class="fa fa-microchip"></i> 监测卫星</div>
            <div class="stat-value"><span id="totalSatellites">0</span><span class="stat-unit">颗</span></div>
        </div>
        <div class="stat-card-compact">
            <div class="stat-label"><i class="fa fa-flag"></i> 监测站</div>
            <div class="stat-value"><span id="totalStations">0</span><span class="stat-unit">个</span></div>
        </div>
        <div class="stat-card-compact">
            <div class="stat-label"><i class="fa fa-check-circle" style="color:#00C851"></i> 无闪烁</div>
            <div class="stat-value level-none"><span id="noneCount">0</span><span class="stat-unit">颗</span></div>
        </div>
        <div class="stat-card-compact">
            <div class="stat-label"><i class="fa fa-exclamation-triangle" style="color:#FFBB33"></i> 弱闪烁</div>
            <div class="stat-value level-weak"><span id="weakCount">0</span><span class="stat-unit">颗</span></div>
        </div>
        <div class="stat-card-compact">
            <div class="stat-label"><i class="fa fa-exclamation-circle" style="color:#FF8800"></i> 中等闪烁</div>
            <div class="stat-value level-moderate"><span id="moderateCount">0</span><span class="stat-unit">颗</span></div>
        </div>
        <div class="stat-card-compact">
            <div class="stat-label"><i class="fa fa-bell" style="color:#FF4444"></i> 强闪烁</div>
            <div class="stat-value level-severe"><span id="severeCount">0</span><span class="stat-unit">颗</span></div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-6 col-md-12">
            <div class="chart-container">
                <h4><i class="fa fa-pie-chart"></i> 闪烁等级分布</h4>
                <div id="levelChart" class="chart-box"></div>
            </div>
        </div>
        <div class="col-lg-6 col-md-12">
            <div class="chart-container">
                <h4><i class="fa fa-bar-chart"></i> 监测站闪烁指数排行</h4>
                <div id="stationsChart" class="chart-box"></div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12">
            <div class="chart-container">
                <h4><i class="fa fa-building"></i> 监测站统计信息</h4>
                <div class="table-wrapper">
                    <table class="table table-custom table-hover" id="stationStatsTable">
                        <thead>
                        <tr><th>#</th><th>监测站ID</th><th>卫星数量</th><th>最大σφ指数</th><th>平均σφ指数</th><th>最差等级</th><th>等级分布</th></tr>
                        </thead>
                        <tbody id="stationStatsBody"><tr><td colspan="7" class="text-center">暂无数据</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12">
            <div class="chart-container">
                <h4><i class="fa fa-satellite-dish"></i> 卫星闪烁详情</h4>
                <div class="table-wrapper">
                    <table class="table table-custom table-hover" id="satelliteDetailsTable">
                        <thead>
                        <tr><th>监测站ID</th><th>卫星编号</th><th>σφ指数</th><th>闪烁等级</th><th>样本数</th><th>告警信息</th></tr>
                        </thead>
                        <tbody id="satelliteDetailsBody"><tr><td colspan="6" class="text-center">暂无数据</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div style="position: fixed; right: 20px; bottom: 20px; font-size: 12px; color: #6c8aac;">
        <i class="fa fa-clock-o"></i> 系统时间: <span id="systemTime"></span>
    </div>

    <div class="ws-status">
        <i class="fa fa-plug"></i>
        WebSocket状态: <span id="wsStatus" class="ws-disconnected">连接中...</span>
    </div>
</div>

<script th:src="@{/js/websocket/sockjs.min.js}"></script>
<script th:src="@{/js/websocket/stomp.min.js}"></script>
<th:block th:include="include :: footer" />

<script th:inline="javascript">
    var ctx = [[@{/}]];

    var phaseDashboard = {
        stompClient: null,
        connected: false,
        refreshInterval: null,
        chartInstances: {},
        currentDataMap: {},

        init: function() {
            this.startTimeUpdater();
            this.initCharts();
            this.initWebSocket();
            this.loadInitialData();
        },

        initCharts: function() {
            if (typeof echarts !== 'undefined') {
                this.chartInstances.levelChart = echarts.init(document.getElementById('levelChart'));
                this.chartInstances.stationsChart = echarts.init(document.getElementById('stationsChart'));
                window.addEventListener('resize', function() {
                    for (var key in phaseDashboard.chartInstances) {
                        if (phaseDashboard.chartInstances[key]) {
                            phaseDashboard.chartInstances[key].resize();
                        }
                    }
                });
            } else {
                console.warn('ECharts未加载');
            }
        },

        initWebSocket: function() {
            var self = this;
            var socketUrl = ctx + 'ws/connect';
            var socket = new SockJS(socketUrl);
            this.stompClient = Stomp.over(socket);
            this.stompClient.debug = null;
            this.stompClient.heartbeat.outgoing = 20000;
            this.stompClient.heartbeat.incoming = 20000;

            this.stompClient.connect({}, function(frame) {
                console.log('WebSocket连接成功: ' + frame);
                self.connected = true;
                $('#wsStatus').text('已连接').removeClass('ws-disconnected').addClass('ws-connected');
                self.stompClient.subscribe('/topic/phase', function(message) {
                    try {
                        var msg = JSON.parse(message.body);
                        var phaseData = null;
                        if (msg.msgType === 'data' && msg.content === '相位闪烁指数数据更新') {
                            phaseData = JSON.parse(msg.extraData);
                        } else if (msg.extraData) {
                            phaseData = JSON.parse(msg.extraData);
                        } else {
                            phaseData = msg;
                        }
                        self.handleRealTimeData(phaseData);
                    } catch(e) {
                        console.error('处理WebSocket消息失败:', e);
                    }
                });
            }, function(error) {
                console.error('WebSocket连接失败:', error);
                $('#wsStatus').text('连接失败').removeClass('ws-connected').addClass('ws-disconnected');
                setTimeout(function() { phaseDashboard.initWebSocket(); }, 5000);
            });
        },

        handleRealTimeData: function(data) {
            if (typeof data === 'string') {
                try { data = JSON.parse(data); } catch(e) { return; }
            }
            if (!Array.isArray(data)) {
                if (data.totalSatellites !== undefined || data.stationStats) {
                    this.renderData(data);
                    return;
                }
                data = [data];
            }
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                if (!item || !item.stationId || !item.satNo) continue;
                var cacheKey = item.stationId + '_' + item.satNo;
                this.currentDataMap[cacheKey] = item;
                var targetRow = this.findSatelliteRow(item.stationId, item.satNo);
                if (targetRow) {
                    var phi4Value = (item.phi4 !== undefined && item.phi4 >= 0) ? item.phi4.toFixed(3) : '--';
                    var levelClass = this.getLevelClass(item.levelName);
                    targetRow.find('td:eq(2)').text(phi4Value);
                    targetRow.find('td:eq(3)').html('<span class="' + levelClass + '">' + (item.levelName || '-') + '</span>');
                    targetRow.find('td:eq(4)').text(item.sampleCount || 0);
                    targetRow.find('td:eq(5)').text(item.alertMessage || '-');
                    targetRow.addClass('data-updated');
                    setTimeout(function() { targetRow.removeClass('data-updated'); }, 500);
                }
            }
            this.refreshStationData();
        },

        // 安全地查找卫星行
        findSatelliteRow: function(stationId, satNo) {
            var tbody = document.getElementById('satelliteDetailsBody');
            if (!tbody) return null;
            var rows = tbody.getElementsByTagName('tr');
            for (var i = 0; i < rows.length; i++) {
                var row = $(rows[i]);
                var rowStationId = row.find('td:first').text().trim();
                var rowSatNo = row.find('td:eq(1)').text().trim();
                if (rowStationId === stationId && rowSatNo === satNo) {
                    return row;
                }
            }
            return null;
        },

        loadInitialData: function() {
            this.showLoading(true);
            $.ajax({
                url: ctx + 'gnss/phase/summary',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response.code === 0 && response.data) {
                        phaseDashboard.renderData(response.data);
                        if (response.data.details) {
                            for (var i = 0; i < response.data.details.length; i++) {
                                var d = response.data.details[i];
                                phaseDashboard.currentDataMap[d.stationId + '_' + d.satNo] = d;
                            }
                        }
                    }
                },
                error: function(xhr, status, error) { console.error('请求失败:', error); },
                complete: function() { phaseDashboard.showLoading(false); }
            });
        },

        refreshData: function() { this.loadInitialData(); },

        refreshStationData: function() {
            $.ajax({
                url: ctx + 'gnss/phase/summary',
                type: 'GET',
                success: function(response) {
                    if (response.code === 0 && response.data) {
                        phaseDashboard.updateStationStatsOnly(response.data);
                    }
                },
                error: function() { console.error('刷新监测站数据失败'); }
            });
        },

        updateStationStatsOnly: function(summary) {
            var stationCount = (summary.stationStats || []).length;
            $('#totalStations').text(stationCount);
            var levelDist = summary.levelDistribution || {};
            $('#noneCount').text(levelDist['无闪烁'] || 0);
            $('#weakCount').text(levelDist['弱闪烁'] || 0);
            $('#moderateCount').text(levelDist['中等闪烁'] || 0);
            $('#severeCount').text(levelDist['强闪烁'] || 0);
            this.updateOverallStatus(summary.overallStatus, summary.overallColor);
            $('#totalSatellites').text(summary.totalSatellites || 0);
            if (summary.reportTime) {
                $('#lastUpdateTime').text(this.formatTime(new Date(summary.reportTime)));
            }
            this.updateAlertBanner(summary);
            this.renderStationStats(summary.stationStats);
            this.updateLevelChart(summary.levelDistribution);
            this.updateStationsChart(summary.stationStats);
        },

        renderData: function(summary) {
            if (!summary) return;
            this.updateOverallStatus(summary.overallStatus, summary.overallColor);
            $('#totalSatellites').text(summary.totalSatellites || 0);
            var stationCount = (summary.stationStats || []).length;
            $('#totalStations').text(stationCount);
            if (summary.reportTime) {
                $('#lastUpdateTime').text(this.formatTime(new Date(summary.reportTime)));
            }
            var levelDist = summary.levelDistribution || {};
            $('#noneCount').text(levelDist['无闪烁'] || 0);
            $('#weakCount').text(levelDist['弱闪烁'] || 0);
            $('#moderateCount').text(levelDist['中等闪烁'] || 0);
            $('#severeCount').text(levelDist['强闪烁'] || 0);
            this.updateAlertBanner(summary);
            this.renderStationStats(summary.stationStats);
            // 安全地渲染卫星详情
            this.renderSatelliteDetailsSafe(summary.details);
            this.updateCharts(summary);
        },

        // 安全的卫星详情渲染方法
        renderSatelliteDetailsSafe: function(details) {
            var tbody = $('#satelliteDetailsBody');
            if (!tbody || tbody.length === 0) {
                console.warn('satelliteDetailsBody元素不存在');
                return;
            }
            if (!details || details.length === 0) {
                tbody.html('<tr><td colspan="6" class="text-center">暂无数据</td></tr>');
                return;
            }
            var stationMap = {};
            for (var i = 0; i < details.length; i++) {
                var d = details[i];
                if (!stationMap[d.stationId]) stationMap[d.stationId] = [];
                stationMap[d.stationId].push(d);
            }
            var html = '';
            for (var sId in stationMap) {
                var sats = stationMap[sId];
                for (var k = 0; k < sats.length; k++) {
                    var sat = sats[k];
                    var levelClass = this.getLevelClass(sat.levelName);
                    var phi4Value = (sat.phi4 !== undefined && sat.phi4 >= 0) ? sat.phi4.toFixed(3) : '--';
                    html += '<tr data-station="' + this.escapeHtml(sId) + '" data-satno="' + this.escapeHtml(sat.satNo) + '">';
                    if (k === 0) {
                        html += '<td rowspan="' + sats.length + '"><strong>' + this.escapeHtml(sId) + '</strong></td>';
                    }
                    html += '<td>' + this.escapeHtml(sat.satNo) + '</td>';
                    html += '<td>' + phi4Value + '</td>';
                    html += '<td class="' + levelClass + '">' + (sat.levelName || '-') + '</td>';
                    html += '<td>' + (sat.sampleCount || 0) + '</td>';
                    html += '<td>' + this.escapeHtml(sat.alertMessage || '-') + '</td>';
                    html += '</tr>';
                }
            }
            if (html === '') {
                html = '<tr><td colspan="6" class="text-center">暂无数据</td></tr>';
            }
            tbody.html(html);
        },

        updateOverallStatus: function(status, color) {
            var ledClass = 'green';
            if (color === '#FF4444') ledClass = 'red';
            else if (color === '#FF8800') ledClass = 'orange';
            else if (color === '#FFBB33') ledClass = 'yellow';
            $('#overallStatus').html('<span class="status-led-sm ' + ledClass + '"></span>' + (status || '未知'));
        },

        updateAlertBanner: function(summary) {
            var banner = $('#alertBanner');
            var message = summary.overallStatus || '系统运行正常';
            var color = summary.overallColor || '#00C851';
            banner.removeClass('success warning info');
            if (color === '#FF4444') {
                banner.addClass('warning').html('<i class="fa fa-bell"></i> <span id="alertMessage">⚠️ ' + message + '</span>');
            } else if (color === '#FF8800') {
                banner.addClass('warning').html('<i class="fa fa-exclamation-triangle"></i> <span id="alertMessage">⚡ ' + message + '</span>');
            } else if (color === '#FFBB33') {
                banner.addClass('info').html('<i class="fa fa-info-circle"></i> <span id="alertMessage">ℹ️ ' + message + '</span>');
            } else {
                banner.addClass('success').html('<i class="fa fa-check-circle"></i> <span id="alertMessage">✅ ' + message + '</span>');
            }
        },

        renderStationStats: function(stats) {
            var tbody = $('#stationStatsBody');
            if (!stats || stats.length === 0) {
                tbody.html('<tr><td colspan="7" class="text-center">暂无数据</td></tr>');
                return;
            }
            var html = '';
            for (var i = 0; i < stats.length; i++) {
                var stat = stats[i];
                var worstLevelClass = this.getLevelClass(stat.worstLevel);
                var levelDistHtml = this.formatLevelDistribution(stat.levelDistribution);
                html += '<tr><td>' + (i + 1) + '</td>';
                html += '<td><strong>' + this.escapeHtml(stat.stationId) + '</strong></td>';
                html += '<td>' + (stat.satelliteCount || 0) + '</td>';
                html += '<td>' + (stat.maxPhi4 ? stat.maxPhi4.toFixed(3) : '-') + '</td>';
                html += '<td>' + (stat.avgPhi4 ? stat.avgPhi4.toFixed(3) : '-') + '</td>';
                html += '<td class="' + worstLevelClass + '">' + (stat.worstLevel || '-') + '</td>';
                html += '<td>' + levelDistHtml + '</td></tr>';
            }
            tbody.html(html);
        },

        formatLevelDistribution: function(levelDist) {
            if (!levelDist) return '-';
            var parts = [];
            if (levelDist['无闪烁'] > 0) parts.push('<span class="level-none">▲' + levelDist['无闪烁'] + '</span>');
            if (levelDist['弱闪烁'] > 0) parts.push('<span class="level-weak">●' + levelDist['弱闪烁'] + '</span>');
            if (levelDist['中等闪烁'] > 0) parts.push('<span class="level-moderate">◆' + levelDist['中等闪烁'] + '</span>');
            if (levelDist['强闪烁'] > 0) parts.push('<span class="level-severe">★' + levelDist['强闪烁'] + '</span>');
            return parts.join(' ') || '-';
        },

        getLevelClass: function(levelName) {
            if (levelName === '强闪烁') return 'level-severe';
            if (levelName === '中等闪烁') return 'level-moderate';
            if (levelName === '弱闪烁') return 'level-weak';
            return 'level-none';
        },

        updateCharts: function(summary) {
            this.updateLevelChart(summary.levelDistribution);
            this.updateStationsChart(summary.stationStats);
        },

        updateLevelChart: function(levelDist) {
            if (!this.chartInstances.levelChart) return;
            var data = [
                { value: levelDist['无闪烁'] || 0, name: '无闪烁', itemStyle: { color: '#00C851' } },
                { value: levelDist['弱闪烁'] || 0, name: '弱闪烁', itemStyle: { color: '#FFBB33' } },
                { value: levelDist['中等闪烁'] || 0, name: '中等闪烁', itemStyle: { color: '#FF8800' } },
                { value: levelDist['强闪烁'] || 0, name: '强闪烁', itemStyle: { color: '#FF4444' } }
            ];
            var option = {
                title: { show: false },
                tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)', backgroundColor: 'rgba(10,26,47,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
                legend: { orient: 'vertical', left: 'left', textStyle: { color: '#e0e0e0' }, data: ['无闪烁', '弱闪烁', '中等闪烁', '强闪烁'] },
                series: [{ name: '闪烁等级', type: 'pie', radius: '55%', center: ['50%', '50%'], data: data, label: { color: '#fff', formatter: '{b}: {d}%' }, emphasis: { scale: true } }],
                backgroundColor: 'transparent'
            };
            this.chartInstances.levelChart.setOption(option, true);
        },

        updateStationsChart: function(stats) {
            if (!this.chartInstances.stationsChart || !stats || stats.length === 0) {
                if (this.chartInstances.stationsChart) this.chartInstances.stationsChart.clear();
                return;
            }
            var topStations = stats.slice(0, 10);
            var stationNames = [], maxPhi4Values = [], avgPhi4Values = [];
            for (var i = 0; i < topStations.length; i++) {
                var name = topStations[i].stationId;
                if (name.length > 15) name = name.substring(0, 12) + '...';
                stationNames.push(name);
                maxPhi4Values.push(topStations[i].maxPhi4 || 0);
                avgPhi4Values.push(topStations[i].avgPhi4 || 0);
            }
            var option = {
                title: { show: false },
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: 'rgba(10,26,47,0.9)', borderColor: '#00d4ff', textStyle: { color: '#fff' } },
                legend: { data: ['最大σφ', '平均σφ'], textStyle: { color: '#e0e0e0' }, top: 0 },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true, backgroundColor: 'transparent' },
                xAxis: { type: 'value', name: 'σφ指数', nameTextStyle: { color: '#8ba0bc' }, axisLabel: { color: '#8ba0bc' }, axisLine: { lineStyle: { color: '#2a4a6a' } } },
                yAxis: { type: 'category', data: stationNames.reverse(), axisLabel: { color: '#e0e0e0', fontSize: 11 }, axisLine: { lineStyle: { color: '#2a4a6a' } }, axisTick: { show: false } },
                series: [
                    { name: '最大σφ', type: 'bar', data: maxPhi4Values.reverse(), itemStyle: { color: '#FF8800', borderRadius: [0, 4, 4, 0] }, label: { show: true, position: 'right', formatter: '{c}', color: '#FF8800' } },
                    { name: '平均σφ', type: 'bar', data: avgPhi4Values.reverse(), itemStyle: { color: '#00d4ff', borderRadius: [0, 4, 4, 0] }, label: { show: true, position: 'right', formatter: '{c}', color: '#00d4ff' } }
                ],
                backgroundColor: 'transparent'
            };
            this.chartInstances.stationsChart.setOption(option, true);
        },

        showLoading: function(show) {
            if (show) $('#loadingOverlay').fadeIn(200);
            else $('#loadingOverlay').fadeOut(200);
        },

        formatTime: function(date) {
            if (!date) return '--:--:--';
            var hours = date.getHours().toString().padStart(2, '0');
            var minutes = date.getMinutes().toString().padStart(2, '0');
            var seconds = date.getSeconds().toString().padStart(2, '0');
            return hours + ':' + minutes + ':' + seconds;
        },

        startTimeUpdater: function() {
            var self = this;
            setInterval(function() { $('#systemTime').text(self.formatTime(new Date())); }, 1000);
        },

        escapeHtml: function(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    };

    $(document).ready(function() { phaseDashboard.init(); });
    $(window).on('beforeunload', function() {
        if (phaseDashboard.stompClient && phaseDashboard.stompClient.connected) {
            phaseDashboard.stompClient.disconnect();
        }
    });
</script>
</body>
</html>
